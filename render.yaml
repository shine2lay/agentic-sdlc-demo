services:
  - type: web
    name: agentic-sdlc-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-sdlc-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://agentic-sdlc-demo.onrender.com

databases:
  - name: agentic-sdlc-db
    plan: free
